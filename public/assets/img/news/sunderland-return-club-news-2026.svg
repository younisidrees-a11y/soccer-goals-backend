<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Sunderland club news graphic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EB172B"/>
      <stop offset="55%" stop-color="#9C1220"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <circle cx="600" cy="330" r="230" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>
  <line x1="600" y1="80" x2="600" y2="580" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <rect x="64" y="56" width="170" height="40" rx="7" fill="#0A1620" fill-opacity="0.4"/>
  <text x="149" y="82" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">CLUB NEWS</text>

  <text x="64" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#ffffff">Sunderland</text>
  <text x="64" y="392" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#ffffff" fill-opacity="0.85">Back in the Premier League</text>

  <text x="64" y="470" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5" fill="#ffffff" fill-opacity="0.9">Stadium of Light</text>

  <rect x="64" y="546" width="1072" height="1.5" fill="#ffffff" fill-opacity="0.18"/>
  <text x="64" y="588" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="1" fill="#ffffff" fill-opacity="0.8">THE SOCCER GOALS · PREMIER LEAGUE 2026-27</text>
</svg>
