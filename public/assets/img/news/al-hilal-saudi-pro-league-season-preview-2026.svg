<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Al-Hilal Saudi Pro League season preview graphic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E74C4"/>
      <stop offset="55%" stop-color="#1E5FAA"/>
      <stop offset="100%" stop-color="#0B2E56"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Crescent motif, a nod to Al-Hilal ("The Crescent") -->
  <g opacity="0.16">
    <circle cx="940" cy="230" r="170" fill="#ffffff"/>
    <circle cx="1005" cy="200" r="170" fill="#0B2E56"/>
  </g>

  <rect x="64" y="56" width="220" height="40" rx="7" fill="#0A1620" fill-opacity="0.4"/>
  <text x="174" y="82" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">SEASON PREVIEW</text>

  <text x="64" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#ffffff">Al-Hilal</text>
  <text x="64" y="382" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#ffffff" fill-opacity="0.82">Defending the crown, one more time</text>

  <text x="64" y="470" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5" fill="#ffffff" fill-opacity="0.9">Opening fixture: Al-Hilal vs Neom</text>
  <text x="64" y="500" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff" fill-opacity="0.7">Kingdom Arena, Riyadh</text>

  <rect x="64" y="546" width="1072" height="1.5" fill="#ffffff" fill-opacity="0.18"/>
  <text x="64" y="588" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="1" fill="#ffffff" fill-opacity="0.8">THE SOCCER GOALS · SAUDI PRO LEAGUE 2026-27</text>
</svg>
